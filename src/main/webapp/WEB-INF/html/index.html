<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="weather-background-page">

<nav class="navbar navbar-light glass-navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <img th:src="@{/images/weather-app.png}"
                 alt="Weather Tracker"
                 width="30"
                 height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>

        <div th:if="${authenticatedUserDto != null}" class="d-flex align-items-center">
            <span th:text="${authenticatedUserDto.login}" class="navbar-text me-3 fw-semibold">login</span>

            <form th:action="@{/auth/sign-out}" method="post">
                <button type="submit" class="btn btn-outline-danger">Sign out</button>
            </form>
        </div>

        <div th:if="${authenticatedUserDto == null}" class="d-flex align-items-center gap-2">
            <a th:href="@{/auth/sign-in}" class="btn btn-outline-primary">Sign in</a>
            <a th:href="@{/auth/sign-up}" class="btn btn-outline-success">Sign up</a>
        </div>
    </div>
</nav>

<section id="page-content" class="weather-page">
    <div class="container py-4">

        <div class="glass-panel mb-4">
            <form th:action="@{/search-results}" method="get" class="d-flex w-100">
                <div class="input-group location-search-input-group flex-grow-1 me-3">
                    <input class="form-control glass-input"
                           type="text"
                           name="name"
                           placeholder="Enter location"
                           required>

                    <button class="btn btn-outline-secondary clear-input-button"
                            type="button"
                            onclick="this.previousElementSibling.value=''">
                        &times;
                    </button>
                </div>

                <button class="btn btn-success px-4" type="submit">Search</button>
            </form>
        </div>

        <div class="row" th:if="${!#lists.isEmpty(locations)}">
            <div class="col-12 col-md-6 col-lg-3 mb-4"
                 th:each="location : ${locations}">

                <div class="card h-100 position-relative weather-card glass-card">

                    <form th:action="@{/locations/{id}(id=${location.id})}"
                          class="position-absolute weather-card-delete-form"
                          th:method="delete">
                        <button class="btn-close" aria-label="Delete" type="submit"></button>
                    </form>

                    <img class="card-img-top img-fluid weather-card-icon"
                         th:src="|https://openweathermap.org/img/wn/${location.icon}@4x.png|"
                         alt="Weather icon">

                    <div class="card-body d-flex flex-column">
                        <h1 class="card-text weather-temp">
                            <span th:text="${location.temp}">7</span>°C
                        </h1>

                        <h3 class="card-title weather-location-title">
                            <span th:text="${location.name}">Tbilisi</span>,
                            <span th:text="${location.country}">GE</span>
                        </h3>

                        <p class="card-text mb-1">
                            Feels like
                            <span th:text="${location.feelsLike}">2</span>°C,
                            <span th:text="${location.description}">Clear sky</span>
                        </p>

                        <p class="card-text mb-1">
                            Humidity:
                            <span th:text="${location.humidity}">70</span>%
                        </p>
                    </div>

                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(locations)}"
             class="glass-panel text-center mt-5">
            <p class="mb-0">You don't have saved locations yet.</p>
        </div>

    </div>
</section>

</body>
</html>
