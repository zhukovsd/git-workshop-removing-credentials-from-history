<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer - 404</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="weather-background-page">

<main class="error-page">
    <section class="error-card error-card-large">
        <div class="error-code" aria-label="404">
            4<span class="sun-zero" aria-hidden="true"></span>4
        </div>

        <h1 class="error-title">Page Not Found</h1>

        <p class="error-description">
            The page you are looking for does not exist or has been moved.
        </p>

        <a class="btn btn-primary error-button" th:href="@{/}">
            Go to Home
        </a>
    </section>
</main>

</body>
</html>
