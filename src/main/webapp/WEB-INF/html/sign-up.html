<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-6">
            <div class="weather-logo"></div>
        </div>
    </div>

    <h2 class="text-center mb-5">Sign Up</h2>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-4 col-md-6 col-sm-12">
            <form th:action="@{/auth/sign-up}" method="POST" class="mt-4" th:object="${signUpDto}">
                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
                    <ul class="mb-0">
                        <li th:if="${#fields.hasErrors('login')}"
                            th:text="${#fields.errors('login')[0]}">
                        </li>

                        <li th:if="${#fields.hasErrors('password')}"
                            th:text="${#fields.errors('password')[0]}">
                        </li>

                        <li th:if="${#fields.hasErrors('confirmPassword')}"
                            th:text="${#fields.errors('confirmPassword')[0]}">
                        </li>
                    </ul>
                </div>
                <div class="mb-3">
                    <label for="login" class="form-label">Login</label>
                    <input type="text" class="form-control" id="login" th:field="*{login}" required/>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" required/>
                </div>
                <div class="mb-3">
                    <label for="repeat-password" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="repeat-password" th:field="*{confirmPassword}" required/>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
                <p class="mt-2 text-center">Already have an account? <a th:href="@{/auth/sign-in}">Sign in here</a></p>
            </form>
        </div>
    </div>
</div>

</body>
</html>
