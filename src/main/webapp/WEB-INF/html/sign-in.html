<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-background-page">

<main class="auth-page">
    <div class="auth-card">
        <div class="weather-logo auth-logo"></div>

        <h2 class="text-center mb-4">Sign In</h2>

        <form th:action="@{/auth/sign-in}" method="POST" th:object="${signInDto}">
            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
                <ul class="mb-0">
                    <li th:if="${#fields.hasErrors('login')}"
                        th:text="${#fields.errors('login')[0]}">
                    </li>

                    <li th:if="${#fields.hasErrors('password')}"
                        th:text="${#fields.errors('password')[0]}">
                    </li>

                    <li th:each="error : ${#fields.globalErrors()}"
                        th:text="${error}">
                    </li>
                </ul>
            </div>

            <div class="mb-3">
                <input type="text"
                       class="form-control auth-input"
                       id="login"
                       placeholder="Login"
                       th:field="*{login}"
                       required>
            </div>

            <div class="mb-3">
                <input type="password"
                       class="form-control auth-input"
                       id="password"
                       placeholder="Password"
                       th:field="*{password}"
                       required>
            </div>

            <button type="submit" class="btn btn-primary auth-button w-100 mt-3">
                Sign In
            </button>

            <p class="mt-4 mb-0 text-center auth-card-footer">
                Don't have an account?
                <a th:href="@{/auth/sign-up}">Sign up</a>
            </p>
        </form>
    </div>
</main>

</body>
</html>
