<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="weather-background-page">

<nav class="navbar navbar-light glass-navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <img th:src="@{/images/weather-app.png}"
                 alt="Weather Tracker"
                 width="30"
                 height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>

        <div th:if="${authenticatedUserDto != null}" class="d-flex align-items-center">
            <span th:text="${authenticatedUserDto.login}" class="navbar-text me-3 fw-semibold">login</span>

            <form th:action="@{/auth/sign-out}" method="post">
                <button type="submit" class="btn btn-outline-danger">Sign out</button>
            </form>
        </div>

        <div th:if="${authenticatedUserDto == null}" class="d-flex align-items-center gap-2">
            <a th:href="@{/auth/sign-in}" class="btn btn-outline-primary">Sign in</a>
            <a th:href="@{/auth/sign-up}" class="btn btn-outline-success">Sign up</a>
        </div>
    </div>
</nav>

<section id="page-content" class="weather-page">
    <div class="container py-4">

        <div class="glass-panel mb-4">
            <form th:action="@{/search-results}" method="get" class="d-flex w-100">
                <div class="input-group location-search-input-group flex-grow-1 me-3">
                    <input class="form-control glass-input"
                           type="text"
                           name="name"
                           placeholder="Enter location"
                           th:value="${name}"
                           required>

                    <button class="btn btn-outline-secondary clear-input-button"
                            type="button"
                            onclick="this.previousElementSibling.value=''">
                        &times;
                    </button>
                </div>

                <button class="btn btn-success px-4" type="submit">Search</button>
            </form>
        </div>

        <div th:if="${errorMessages}" class="glass-panel mb-4">
            <ul class="mb-0">
                <li th:each="error : ${errorMessages}"
                    th:text="${error}">
                </li>
            </ul>
        </div>

        <div th:if="${#strings.isEmpty(name)}" class="glass-panel mb-4">
            <p class="mb-0">Enter location name to search.</p>
        </div>

        <div th:if="${!#strings.isEmpty(name) and locations.isEmpty()}" class="glass-panel mb-4">
            <p class="mb-0">No locations found.</p>
        </div>

        <div th:if="${!locations.isEmpty()}">
            <div class="glass-panel mb-4">
                <h2 class="mb-0">Locations:</h2>
            </div>

            <div class="row">
                <div class="col-12 col-md-6 col-lg-3 mb-4"
                     th:each="location : ${locations}">

                    <div class="card h-100 search-location-card glass-card">
                        <div class="card-body d-flex flex-column">

                            <h5 class="card-title fw-bold" th:text="${location.name}">Location name</h5>

                            <p class="card-text mb-1">
                                Latitude:
                                <span th:text="${location.latitude}">0</span>
                            </p>

                            <p class="card-text mb-1">
                                Longitude:
                                <span th:text="${location.longitude}">0</span>
                            </p>

                            <p class="card-text mb-1">
                                Country:
                                <span th:text="${location.country}">GE</span>
                            </p>

                            <p class="card-text mb-3"
                               th:if="${location.state != null}">
                                State:
                                <span th:text="${location.state}">State</span>
                            </p>

                            <div class="mt-auto">
                                <form th:action="@{/locations}" method="post">
                                    <input type="hidden" name="name" th:value="${location.name}">
                                    <input type="hidden" name="latitude" th:value="${location.latitude}">
                                    <input type="hidden" name="longitude" th:value="${location.longitude}">

                                    <button class="btn btn-primary w-100" type="submit">
                                        Add
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</section>

</body>
</html>
