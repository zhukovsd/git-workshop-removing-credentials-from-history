<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/weather-app.png}" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>

        <div th:if="${authenticatedUserDto != null}" class="d-flex align-items-center">
            <span th:text="${authenticatedUserDto.login}" class="navbar-text me-3">login</span>
            <form th:action="@{/auth/sign-out}" method="post">
                <button type="submit" class="btn btn-outline-danger">Sign out</button>
            </form>
        </div>

        <div th:if="${authenticatedUserDto == null}" class="d-flex align-items-center gap-2">
            <a th:href="@{/auth/sign-in}" class="btn btn-outline-primary">Sign in</a>
            <a th:href="@{/auth/sign-up}" class="btn btn-outline-success">Sign up</a>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <div class="d-flex my-4">

            <form th:action="@{/search-results}" method="get" class="d-flex my-4 w-100">
                <div class="input-group location-search-input-group flex-grow-1 me-3">
                    <input class="form-control" type="text" name="name" placeholder="Enter location" th:value="${name}"
                           required>
                    <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                            onclick="this.previousElementSibling.value=''">
                        &times;
                    </button>
                </div>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>

        </div>

        <div>
            <div th:if="${#strings.isEmpty(name)}" class="alert alert-secondary">
                Enter location name to search
            </div>

            <div th:if="${!#strings.isEmpty(name) and locations.isEmpty()}"
                 class="alert alert-secondary">
                No locations found
            </div>

            <div class="row" th:if="${!locations.isEmpty()}">
                <h2>Locations:</h2>

                <div class="col-12 col-lg-3 col-md-6 mb-4"
                     th:each="location : ${locations}">

                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">

                            <h5 class="card-title" th:text="${location.name}"></h5>

                            <p class="card-text mb-1">
                                Latitude:
                                <span th:text="${location.latitude}"></span>
                            </p>

                            <p class="card-text mb-1">
                                Longitude:
                                <span th:text="${location.longitude}"></span>
                            </p>

                            <p class="card-text mb-1">
                                Country:
                                <span th:text="${location.country}"></span>
                            </p>

                            <p class="card-text mb-3"
                               th:if="${location.state != null}">
                                State:
                                <span th:text="${location.state}"></span>
                            </p>

                            <div class="mt-auto">
                                <form th:action="@{/locations}" method="post">
                                    <input type="hidden" name="name" th:value="${location.name}">
                                    <input type="hidden" name="latitude" th:value="${location.latitude}">
                                    <input type="hidden" name="longitude" th:value="${location.longitude}">

                                    <button class="btn btn-primary w-100" type="submit">
                                        Add
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
